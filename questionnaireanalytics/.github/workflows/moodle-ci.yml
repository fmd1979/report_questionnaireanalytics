name: Moodle tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  phpunit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        moodle: [MOODLE_500_STABLE, MOODLE_501_STABLE]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, intl, zip, gd, soap
          ini-values: max_input_vars=5000
          coverage: none
      - name: Set up Moodle Plugin CI
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install Moodle and Questionnaire
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle }}
        run: |
          moodle-plugin-ci add-plugin --branch MOODLE_500_STABLE PoetOS/moodle-mod_questionnaire
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
      - run: moodle-plugin-ci phplint
      - run: moodle-plugin-ci validate
      - run: moodle-plugin-ci phpunit --fail-on-warning
